<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
        <style>
            body {
                margin: 0;
                overflow: hidden;
            }
            /* Button zum Zurückkehren zur Hauptseite */
            .back-button {
                position: absolute;
                top: 20px;
                left: 20px;
                z-index: 1000;
                padding: 10px;
                background: rgba(0, 0, 0, 0.5);
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <button class="back-button" onclick="location.href = '../index.html'">
            Zurück
        </button>

        <a-scene
            mindar-image="imageTargetSrc: QR-Code.mind;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
        >
            <a-assets>
                <a-asset-item
                    id="gearsModel"
                    src="../AR Gears.glb"
                ></a-asset-item>
            </a-assets>

            <a-camera
                position="0 0 0"
                look-controls="enabled: false"
            ></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-gltf-model
                    rotation="0 0 0"
                    position="0 0 0"
                    scale="0.1 0.1 0.1"
                    src="#gearsModel"
                    animation-mixer
                >
                </a-gltf-model>
            </a-entity>
        </a-scene>
    </body>
</html>
