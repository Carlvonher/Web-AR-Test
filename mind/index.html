<html>
    <head>
        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

        <style>
            /* Verhindert, dass die UI Elemente verschwinden */
            body {
                margin: 0;
                overflow: hidden;
            }

            /* Sorgt dafür, dass die Kamera-Ebene hinter allem liegt */
            .a-canvas {
                width: 100% !important;
                height: 100% !important;
                top: 0;
                left: 0;
                position: absolute;
            }
        </style>
    </head>

    <body>
        <button
            style="position: absolute; z-index: 999; top: 10px; left: 10px"
            onclick="window.location.href = '../index.html'"
        >
            Zurück
        </button>

        <a-scene
            mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: yes; uiScanning: yes;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
        >
            <a-camera
                position="0 0 0"
                look-controls="enabled: false"
                cursor="fuse: false; rayOrigin: mouse;"
                raycaster="far: 10000; objects: .clickable"
            ></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box
                    color="blue"
                    position="0 0 0"
                    scale="0.5 0.5 0.5"
                ></a-box>
            </a-entity>
        </a-scene>
    </body>
</html>
